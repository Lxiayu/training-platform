<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 启航编程管理系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-blob" style="width:360px;height:360px;background:#8b5cf6;top:-80px;left:-80px;"></div>
    <div class="login-blob" style="width:420px;height:420px;background:#0ea5e9;bottom:-120px;right:-100px;"></div>

    <div class="login-card">
      <div class="login-logo">启</div>
      <h1 class="login-title">启航编程管理系统</h1>
      <p class="login-sub">Qihang Coding Education · 培训机构一站式管理平台</p>

      <div class="login-tip">
        <b>演示账号</b>（不同角色权限不同）<br>
        超级管理员：<b>admin</b> / <b>admin123</b><br>
        教务管理员：<b>jiaowu</b> · 财务专员：<b>caiwu</b> · 前台：<b>qiantai</b>（密码均为 <b>123456</b>）<br>
        本版本为前后端联调演示版，数据由 FastAPI 服务提供，可一键重置。
      </div>

      <form class="login-form" id="login-form" autocomplete="off">
        <div class="form-item">
          <label>账号</label>
          <input class="input" id="username" placeholder="请输入账号" value="admin">
        </div>
        <div class="form-item">
          <label>密码</label>
          <input class="input" type="password" id="password" placeholder="请输入密码" value="admin123">
        </div>
        <div class="login-row">
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
            <input type="checkbox" checked> 记住我
          </label>
          <a href="javascript:;">忘记密码？</a>
        </div>
        <button class="btn btn-block" type="submit" style="padding:11px;">登 录</button>
      </form>

      <p class="login-copyright">© 2026 启航编程教育 · 演示版 v0.3</p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script>
    // 已登录（token 仍有效）则直接进入系统
    if (getToken()) location.replace('dashboard.html');

    document.getElementById('login-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      const remember = document.querySelector('.login-row input[type=checkbox]').checked;
      const btn = this.querySelector('button[type=submit]');
      if (!u || !p) { showToast('请输入账号和密码', 'error'); return; }
      btn.disabled = true;
      try {
        const data = await api.login(u, p);
        saveSession(data.token, data.user, remember);
        showToast('登录成功，正在进入系统…');
        setTimeout(() => location.href = 'dashboard.html', 600);
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
