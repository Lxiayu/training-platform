<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新闻中心 - 启航编程管理系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="card" style="margin-bottom:18px;">
          <div class="toolbar" style="border-bottom:none;">
            <div class="chips" id="chips"></div>
            <div class="toolbar-spacer"></div>
            <div class="search-box">
              <span data-icon="search"></span>
              <input class="input" id="kw" placeholder="搜索新闻标题 / 摘要" style="width:220px;">
            </div>
            <button class="btn" id="btn-add"><span data-icon="plus"></span>发布资讯</button>
          </div>
        </div>

        <div id="news-hero"></div>
        <div class="news-list" id="news-list"></div>
      </main>
    </div>
  </div>

  <!-- 新闻详情模态框 -->
  <div class="modal" id="detail-modal">
    <div class="modal-mask"></div>
    <div class="modal-box modal-lg">
      <div class="modal-head">
        <h3>新闻详情</h3>
        <button class="modal-x" data-close><span data-icon="x"></span></button>
      </div>
      <div class="modal-body" id="detail-body"></div>
    </div>
  </div>

  <!-- 发布 / 编辑新闻模态框 -->
  <div class="modal" id="editor-modal">
    <div class="modal-mask"></div>
    <div class="modal-box modal-lg">
      <div class="modal-head">
        <h3 id="modal-title">发布新闻</h3>
        <button class="modal-x" data-close><span data-icon="x"></span></button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-item full">
            <label>新闻标题<span class="req">*</span></label>
            <input class="input" id="f-title" placeholder="请输入新闻标题" maxlength="60">
          </div>
          <div class="form-item">
            <label>分类<span class="req">*</span></label>
            <select class="select" id="f-cat">
              <option>机构动态</option><option>活动通知</option>
              <option>比赛获奖</option><option>开班信息</option>
            </select>
          </div>
          <div class="form-item">
            <label>是否置顶</label>
            <select class="select" id="f-top"><option value="否">否</option><option value="是">是</option></select>
          </div>
          <div class="form-item">
            <label>发布日期<span class="req">*</span></label>
            <input class="input" id="f-date" type="date">
          </div>
          <div class="form-item">
            <label>作者<span class="req">*</span></label>
            <input class="input" id="f-author" placeholder="默认为当前登录用户">
          </div>
          <div class="form-item full">
            <label>摘要<span class="req">*</span></label>
            <textarea class="input" id="f-summary" rows="2" maxlength="120" placeholder="一句话概述，将显示在新闻列表中"></textarea>
          </div>
          <div class="form-item full">
            <label>正文内容<span class="req">*</span></label>
            <textarea class="input" id="f-content" rows="8" placeholder="请输入正文，每空一行视为一个自然段"></textarea>
          </div>
          <div class="form-item">
            <label>发布状态</label>
            <select class="select" id="f-status-edit"><option>已发布</option><option>草稿</option></select>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" data-close>取 消</button>
        <button class="btn" id="btn-submit">发 布</button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/news.js"></script>
</body>
</html>
