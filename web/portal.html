<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的门户 - 启航编程管理系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div id="portal-content"></div>
      </main>
    </div>
  </div>

  <!-- 通用弹窗（作业编辑 / 提交 / 批改复用） -->
  <div class="modal" id="portal-modal">
    <div class="modal-mask" data-close></div>
    <div class="modal-box modal-lg">
      <div class="modal-head">
        <h3 id="pm-title">操作</h3>
        <button class="modal-x" data-close><span data-icon="x"></span></button>
      </div>
      <div class="modal-body" id="pm-body"></div>
      <div class="modal-foot">
        <button class="btn btn-ghost" data-close>取 消</button>
        <button class="btn" id="pm-submit">保 存</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/portal.js"></script>
</body>
</html>
