<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人信息 - 启航编程管理系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="page-head">
          <div class="page-head-main">
            <h1>个人信息</h1>
            <div class="sub">查看与维护我的资料</div>
          </div>
        </div>
        <div class="profile-grid">

          <!-- 左侧：个人卡片 -->
          <div class="card profile-card">
            <div class="profile-avatar" id="p-avatar">明远</div>
            <div class="profile-name" id="p-name">–</div>
            <div class="profile-role" id="p-role"><span class="badge badge-primary">–</span></div>
            <div class="profile-rows">
              <div><span class="k">登录账号</span><b id="p-username">–</b></div>
              <div><span class="k">手机号码</span><b id="p-phone">–</b></div>
              <div><span class="k">电子邮箱</span><b id="p-email">–</b></div>
              <div><span class="k">加入时间</span><b id="p-join">–</b></div>
            </div>
          </div>

          <!-- 右侧：编辑表单 -->
          <div>
            <div class="card">
              <div class="card-head">
                <div class="card-title"><span data-icon="idcard"></span>基本信息</div>
              </div>
              <div class="card-body">
                <div class="form-grid">
                  <div class="form-item">
                    <label>姓名<span class="req">*</span></label>
                    <input class="input" id="f-name" placeholder="请输入姓名">
                  </div>
                  <div class="form-item">
                    <label>手机号码<span class="req">*</span></label>
                    <input class="input" id="f-phone" placeholder="请输入 11 位手机号" maxlength="11">
                  </div>
                  <div class="form-item full">
                    <label>电子邮箱</label>
                    <input class="input" id="f-email" placeholder="name@qihangcode.cn">
                  </div>
                </div>
                <div style="display:flex;justify-content:flex-end;margin-top:18px;">
                  <button class="btn" id="btn-save-profile">保存修改</button>
                </div>
              </div>
            </div>

            <div class="card section-gap">
              <div class="card-head">
                <div class="card-title"><span data-icon="lock"></span>修改密码</div>
              </div>
              <div class="card-body">
                <div class="form-grid">
                  <div class="form-item full">
                    <label>原密码<span class="req">*</span></label>
                    <input class="input" type="password" id="f-oldpwd" placeholder="请输入当前密码">
                  </div>
                  <div class="form-item">
                    <label>新密码<span class="req">*</span></label>
                    <input class="input" type="password" id="f-newpwd" placeholder="至少 6 位">
                  </div>
                  <div class="form-item">
                    <label>确认新密码<span class="req">*</span></label>
                    <input class="input" type="password" id="f-newpwd2" placeholder="再次输入新密码">
                  </div>
                </div>
                <div style="display:flex;justify-content:flex-end;margin-top:18px;">
                  <button class="btn btn-outline" id="btn-save-pwd">修改密码</button>
                </div>
              </div>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
